<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Controller architecture (conceptual diagram)">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="430" fill="#070b12"/><text x="40" y="34" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#f3f7fb">Controller architecture</text><text x="1160" y="34" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="11" fill="#5b6b82">conceptual diagram, not race footage</text>
<rect x="40" y="70" width="200" height="72" rx="8" fill="#0d1624" stroke="#22d3ee" stroke-opacity="0.75"/><text x="140.0" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3f7fb">Track model</text><text x="140.0" y="120" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#9fb0c5">stock XML, exact arcs</text><rect x="290" y="70" width="200" height="72" rx="8" fill="#0d1624" stroke="#22d3ee" stroke-opacity="0.75"/><text x="390.0" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3f7fb">Line planner</text><text x="390.0" y="120" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#9fb0c5">min-curvature + min-time</text><rect x="540" y="70" width="200" height="72" rx="8" fill="#0d1624" stroke="#22d3ee" stroke-opacity="0.75"/><text x="640.0" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3f7fb">Speed planner</text><text x="640.0" y="120" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#9fb0c5">axle-load grip model</text><rect x="790" y="70" width="200" height="72" rx="8" fill="#0d1624" stroke="#22d3ee" stroke-opacity="0.75"/><text x="890.0" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3f7fb">Plan arrays</text><text x="890.0" y="120" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#9fb0c5">line, k, speed, windows</text>
<line x1="240" y1="106" x2="288" y2="106" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/><line x1="490" y1="106" x2="538" y2="106" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/><line x1="740" y1="106" x2="788" y2="106" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
<text x="40" y="190" font-family="Consolas, Menlo, monospace" font-size="12" fill="#7dd3fc">per step (50 Hz)</text>
<rect x="40" y="210" width="220" height="90" rx="8" fill="#0d1624" stroke="#22d3ee" stroke-opacity="0.75"/><text x="150.0" y="238" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3f7fb">Lateral control</text><text x="150.0" y="260" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#9fb0c5">curvature command, feedback, slip</text><rect x="290" y="210" width="220" height="90" rx="8" fill="#0d1624" stroke="#22d3ee" stroke-opacity="0.75"/><text x="400.0" y="238" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3f7fb">Longitudinal control</text><text x="400.0" y="260" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#9fb0c5">speed target, braking</text><rect x="540" y="210" width="220" height="90" rx="8" fill="#0d1624" stroke="#22d3ee" stroke-opacity="0.75"/><text x="650.0" y="238" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3f7fb">Traction / ABS</text><text x="650.0" y="260" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#9fb0c5">rear slip, front slip limits</text><rect x="790" y="210" width="220" height="90" rx="8" fill="#0d1624" stroke="#22d3ee" stroke-opacity="0.75"/><text x="900.0" y="238" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3f7fb">Gearbox + launch</text><text x="900.0" y="260" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#9fb0c5">rpm rule, clutch, TC allowance</text>
<line x1="890" y1="142" x2="890" y2="176" stroke="#2563eb" stroke-width="2"/><line x1="150" y1="176" x2="890" y2="176" stroke="#2563eb" stroke-width="2"/><line x1="150" y1="176" x2="150" y2="208" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/><line x1="400" y1="176" x2="400" y2="208" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/><line x1="650" y1="176" x2="650" y2="208" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/><line x1="900" y1="176" x2="900" y2="208" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
<rect x="290" y="350" width="420" height="60" rx="8" fill="#0d1624" stroke="#2563eb" stroke-opacity="0.75"/><text x="500.0" y="378" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3f7fb">SCR UDP client (starter loop) + GC guard</text><text x="500.0" y="400" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#9fb0c5">port 3001, sensors in, actions out</text><rect x="790" y="350" width="200" height="60" rx="8" fill="#0d1624" stroke="#2563eb" stroke-opacity="0.75"/><text x="890.0" y="378" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3f7fb">TORCS</text><text x="890.0" y="400" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#9fb0c5">stock car, stock physics</text>
<path d="M150 300V326M400 300V326M650 300V326M900 300V326M150 326H900" fill="none" stroke="#2563eb" stroke-width="2"/><line x1="500" y1="326" x2="500" y2="348" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/><line x1="710" y1="380" x2="788" y2="380" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
<path d="M990 380H1100V255H1012" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="1106" y="320" font-family="Consolas, Menlo, monospace" font-size="11" fill="#22d3ee">sensors</text></svg>